name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm run build
      - run: npm test
      - run: npm run lint:firefox
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/hush-*-chromium.zip \
            dist/hush-*-firefox-unsigned.xpi \
            dist/hush-*-source.zip \
            dist/SHA256SUMS \
            --title "Hush ${GITHUB_REF_NAME#v}" \
            --generate-notes
